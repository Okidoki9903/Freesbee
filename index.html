<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Freesbee</title>
<meta name="description" content="Pick your dog and catch the frisbee your owner throws. Free 3D browser game: keyboard, touch or controller.">
<meta property="og:type" content="website">
<meta property="og:title" content="Freesbee">
<meta property="og:description" content="Pick your dog and catch the frisbee. Free 3D game, play right in your browser.">
<meta property="og:url" content="https://okidoki9903.github.io/Freesbee/">
<meta property="og:image" content="https://okidoki9903.github.io/Freesbee/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Freesbee">
<meta name="twitter:description" content="Pick your dog and catch the frisbee. Free 3D game, play right in your browser.">
<meta name="twitter:image" content="https://okidoki9903.github.io/Freesbee/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --ink: #1f3a22;
    --paper: #fbf7ea;
    --disc: #ff5a1f;
    --disc-deep: #c93d0c;
    --sky: #a9d8f0;
    --rec: #e02b2b;
    --bar: #3fa0d8;
    --shade: rgba(20, 40, 22, 0.55);
    --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); }
  body {
    font-family: var(--body); color: var(--ink);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(10, 30, 12, 0.28) 100%);
  }
  button, a.btn { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--bar); outline-offset: 2px; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none;
  }
  .hud-col { display: grid; gap: 8px; justify-items: start; }
  .hud-col.right { justify-items: end; }
  .row { display: flex; gap: 8px; align-items: center; }
  .chip {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
    padding: 6px 12px; box-shadow: 0 4px 0 var(--ink);
  }
  .chip small {
    display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase; opacity: 0.7;
  }
  .score { font-family: var(--display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  .lives { display: flex; gap: 6px; padding-block: 10px; }
  .life {
    width: 26px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #ffd2bd 0 18%, var(--disc) 20% 100%);
    border: 2px solid var(--disc-deep); transition: opacity .3s, transform .3s;
  }
  .life.lost { opacity: 0.2; transform: scale(0.8); filter: grayscale(1); }
  .wind { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 6px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .wind svg { width: 26px; height: 26px; transition: transform .25s; }
  .pad { font-weight: 800; font-size: 12px; padding: 4px 10px; display: flex; gap: 6px; align-items: center; }
  .pad svg { width: 20px; height: 14px; }
  .icon-btn {
    pointer-events: auto; cursor: pointer; width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .rec-btn .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--rec); border: 2px solid var(--ink); box-sizing: border-box; }
  .rec-btn.on .dot { border-radius: 3px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .rec-live {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 56px);
    background: var(--rec); color: #fff; font-weight: 800; font-size: 13px; letter-spacing: 0.08em;
    padding: 4px 10px; border-radius: 999px; pointer-events: none; font-variant-numeric: tabular-nums; z-index: 4;
  }

  .status {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 44px);
    font-weight: 800; font-size: 15px; color: var(--paper);
    background: var(--shade); padding: 6px 14px; border-radius: 999px;
    white-space: nowrap; pointer-events: none; max-width: calc(100% - 32px);
    overflow: hidden; text-overflow: ellipsis;
  }
  .combo {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    font-family: var(--display); font-size: 26px; color: var(--disc);
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
    pointer-events: none;
  }
  .popup {
    position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%);
    font-family: var(--display); font-size: clamp(30px, 8vw, 56px); color: var(--paper);
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-align: center;
    pointer-events: none; opacity: 0; line-height: 1.05; white-space: nowrap;
  }
  .popup span { display: block; font-size: 0.55em; color: var(--disc); }
  .popup.show { animation: pop 1.3s ease-out forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    25% { transform: translate(-50%, -50%) scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 86px);
    transform: translateX(-50%); background: var(--ink); color: var(--paper);
    font-weight: 800; font-size: 14px; padding: 8px 14px; border-radius: 12px;
    pointer-events: none; opacity: 0; transition: opacity .3s; max-width: calc(100% - 32px);
    text-align: center; z-index: 5;
  }
  .toast.show { opacity: 1; }
  body.is-touch:not(.pad-active) .status { bottom: calc(env(safe-area-inset-bottom, 0px) + 142px); }
  body.is-touch:not(.pad-active) .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 184px); }

  .stamina {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    width: min(220px, 44vw); height: 12px; border: 3px solid var(--ink);
    border-radius: 999px; background: var(--paper); overflow: hidden; pointer-events: none;
  }
  .stamina i { display: block; height: 100%; width: 100%; background: var(--bar); transform-origin: left; }
  .stamina.tired i { background: #d85a3f; }
  body.in-menu .hud, body.in-menu .status, body.in-menu .stamina, body.in-menu .touch, body.in-menu .combo { display: none; }

  /* ---------- Touch controls ---------- */
  .touch { display: none; }
  body.is-touch .touch { display: block; }
  body.pad-active .touch { display: none; }
  .stick-base {
    position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 3px solid rgba(251, 247, 234, 0.8); background: rgba(31, 58, 34, 0.25);
    pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  .stick-base.on { opacity: 1; }
  .stick-knob {
    position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border-radius: 50%; background: var(--paper); border: 3px solid var(--ink);
  }
  .btn-round {
    position: fixed; border-radius: 50%; border: 3px solid var(--ink);
    font-family: var(--display); color: var(--ink); box-shadow: 0 5px 0 var(--ink);
    display: grid; place-items: center; font-size: 16px;
  }
  .btn-round.down { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  #btnJump { right: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); width: 88px; height: 88px; background: var(--disc); color: var(--paper); -webkit-text-stroke: 1px var(--ink); font-size: 18px; }
  #btnSprint { right: 122px; bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); width: 70px; height: 70px; background: var(--paper); }

  /* ---------- Screens ---------- */
  .screen {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding-inline: 16px; background: rgba(31, 58, 34, 0.35); overflow-y: auto; z-index: 3;
  }
  .card {
    background: var(--paper); border: 4px solid var(--ink); border-radius: 22px;
    box-shadow: 0 8px 0 var(--ink); padding: 22px 22px 24px; margin-block: 16px;
    width: min(460px, 100%); box-sizing: border-box; text-align: center;
    display: grid; gap: 14px;
  }
  .card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 36px; text-wrap: balance; }
  .card p { margin: 0; line-height: 1.45; font-size: 15px; text-wrap: pretty; }
  .final { font-family: var(--display); font-size: 56px; line-height: 1; color: var(--disc); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .btns { display: grid; gap: 10px; }
  .btns.two { display: flex; }
  .btns.two > * { flex: 1 1 0; min-width: 0; }
  .play, .btn {
    font-family: var(--display); font-size: 22px; color: var(--paper); background: var(--disc);
    border: 3px solid var(--ink); border-radius: 16px; padding: 11px 16px; cursor: pointer;
    box-shadow: 0 5px 0 var(--ink); -webkit-text-stroke: 1px var(--ink); text-decoration: none;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .btn { flex-direction: row; gap: 8px; }
  .btn.alt { background: var(--paper); color: var(--ink); -webkit-text-stroke: 0; font-size: 18px; }
  .btn.dark { background: #0f1419; color: #fff; -webkit-text-stroke: 0; font-size: 18px; }
  .btn svg { width: 18px; height: 18px; }
  .play:active, .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .play small { font-family: var(--body); font-size: 13px; -webkit-text-stroke: 0; opacity: 0.9; display: block; }
  .card p.note { font-size: 13px; opacity: 0.8; }

  /* Start / breed selection: the dog stays visible above the panel */
  .select {
    place-items: end center; align-content: end; background: linear-gradient(180deg, rgba(31,58,34,0) 30%, rgba(31,58,34,0.35) 100%);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  .brand {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 0; right: 0; text-align: center;
    pointer-events: none;
  }
  .brand h1 {
    margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(44px, 12vw, 76px); line-height: 0.95;
    color: var(--disc); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  }
  .brand p { margin: 4px 0 0; font-weight: 800; color: var(--paper); text-shadow: 0 2px 0 var(--ink), 0 0 8px rgba(0,0,0,.3); font-size: 15px; padding-inline: 16px; }
  .panel {
    background: var(--paper); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
    width: min(520px, 100%); box-sizing: border-box; padding: 14px 16px 16px; display: grid; gap: 12px; margin-bottom: 8px;
  }
  .panel-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: -6px; }
  .lang { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
  .lang svg { width: 16px; height: 16px; }
  .lang select {
    font: inherit; color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 8px;
    padding: 3px 6px; cursor: pointer;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .breed-nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
  .nav-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--disc);
    color: var(--paper); font-family: var(--display); font-size: 24px; line-height: 1; cursor: pointer; box-shadow: 0 3px 0 var(--ink);
    display: grid; place-items: center; padding: 0;
  }
  .nav-btn:active { transform: translateY(3px); box-shadow: none; }
  .breed-info { text-align: center; min-width: 0; }
  .breed-info h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.05; }
  .breed-info p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.35; min-height: 2.7em; }
  .breed-count { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; opacity: 0.6; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; margin: 0; }
  .stat { display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 800; }
  .stat dd { margin: 0; }
  .bar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
  .bar i { height: 9px; border-radius: 2px; background: rgba(31, 58, 34, 0.14); }
  .bar i.on { background: var(--bar); }
  .bar.top i.on { background: var(--disc); }
  .diff { display: grid; grid-template-columns: repeat(3, 1fr); border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; }
  .diff button {
    border: 0; background: transparent; padding: 7px 4px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink);
  }
  .diff button + button { border-left: 3px solid var(--ink); }
  .diff button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
  .diff-note { font-size: 12.5px; text-align: center; margin: -4px 0 0; opacity: 0.8; min-height: 1.3em; }
  details.help { font-size: 13.5px; text-align: left; }
  details.help summary { cursor: pointer; font-weight: 800; text-align: center; list-style: none; opacity: 0.75; }
  details.help summary::-webkit-details-marker { display: none; }
  .controls { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; align-items: center; margin: 10px 0 0; }
  .controls dt { font-weight: 800; }
  .controls dd { margin: 0; }
  .ctrl-set { display: none; }
  body:not(.is-touch):not(.pad-active) .ctrl-keys { display: contents; }
  body.is-touch:not(.pad-active) .ctrl-touch { display: contents; }
  body.pad-active .ctrl-pad { display: contents; }
  kbd {
    font-family: var(--body); font-weight: 800; font-size: 12px; border: 2px solid var(--ink);
    border-bottom-width: 3px; border-radius: 6px; padding: 0 5px; background: #fff; white-space: nowrap;
  }
  kbd.round { border-radius: 999px; }
  /* Landscape: panel on the right, dog on the left */
  @media (min-width: 740px) and (min-aspect-ratio: 5/4) {
    .select { place-items: center end; align-content: center; padding-right: max(16px, 4vw); padding-bottom: 0; background: linear-gradient(90deg, rgba(31,58,34,0) 45%, rgba(31,58,34,0.3) 100%); }
    .brand { text-align: left; left: max(16px, 4vw); right: auto; }
    .brand p { padding: 0; }
    .panel { width: min(440px, 48vw); margin-block: 12px; }
  }
  @media (min-width: 740px) and (min-aspect-ratio: 5/4) and (min-height: 700px) {
    .stats { grid-template-columns: 1fr; }
  }
  /* Short screens: keep the essentials */
  @media (max-height: 520px) {
    .brand h1 { font-size: 38px; }
    .brand p, .diff-note, details.help { display: none; }
    .breed-info p { min-height: 0; font-size: 12.5px; }
    .panel { gap: 8px; padding: 10px 12px 12px; }
    .play { padding-block: 7px; }
  }
  @media (max-height: 640px) and (max-aspect-ratio: 5/4) {
    .brand h1 { font-size: 40px; }
    .brand p { display: none; }
    .breed-info p { min-height: 0; }
  }

  video.clip { width: 100%; max-height: 50vh; border-radius: 12px; border: 3px solid var(--ink); background: #000; }

  @media (prefers-reduced-motion: reduce) {
    .popup.show { animation-duration: 0.01s; animation-fill-mode: none; opacity: 1; }
    .rec-btn.on .dot { animation: none; }
  }
</style>
</head>
<body class="in-menu">
<div id="game"></div>
<div class="vignette"></div>

<div class="hud">
  <div class="hud-col">
    <div class="chip"><small id="hudBreed">Score</small><div class="score" id="score">0</div></div>
    <div class="chip wind" id="wind" data-i18n-title="hud.wind">
      <svg viewBox="0 0 24 24" id="windArrow" aria-hidden="true"><path d="M12 2 L18 12 H14 V22 H10 V12 H6 Z" fill="#3fa0d8" stroke="#1f3a22" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span id="windText" data-i18n="hud.noWind">No wind</span>
    </div>
  </div>
  <div class="hud-col right">
    <div class="row">
      <div class="chip lives" data-i18n-aria="hud.lives">
        <div class="life"></div><div class="life"></div><div class="life"></div>
      </div>
      <button class="chip icon-btn rec-btn" id="recBtn" type="button" data-i18n-aria="hud.rec" data-i18n-title="hud.rec"><span class="dot"></span></button>
      <button class="chip icon-btn" id="pauseBtn" type="button" data-i18n-aria="hud.pause">
        <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" rx="1" fill="#1f3a22"/><rect x="11" y="2" width="4" height="14" rx="1" fill="#1f3a22"/></svg>
      </button>
    </div>
    <div class="chip pad" id="padChip" hidden>
      <svg viewBox="0 0 40 28" aria-hidden="true"><path d="M8 4 H32 C37 4 40 10 40 18 C40 26 34 27 30 21 L27 17 H13 L10 21 C6 27 0 26 0 18 C0 10 3 4 8 4 Z" fill="#1f3a22"/><circle cx="30" cy="11" r="2.4" fill="#ff5a1f"/><rect x="7" y="10" width="8" height="2.4" fill="#fbf7ea"/><rect x="9.8" y="7.2" width="2.4" height="8" fill="#fbf7ea"/></svg>
      <span>Controller</span>
    </div>
  </div>
</div>
<div class="rec-live" id="recLive" hidden>● REC <span id="recTime">0:00</span></div>
<div class="combo" id="combo" hidden></div>
<div class="status" id="status" data-i18n="st.waiting">Your owner is waiting…</div>
<div class="popup" id="popup"></div>
<div class="toast" id="toast"></div>
<div class="stamina" id="stamina"><i id="staminaFill"></i></div>

<div class="touch">
  <div class="stick-base" id="stickBase"><div class="stick-knob" id="stickKnob"></div></div>
  <div class="btn-round" id="btnSprint" data-i18n="touch.sprintBtn">Sprint</div>
  <div class="btn-round" id="btnJump" data-i18n="touch.jumpBtn">Jump</div>
</div>

<!-- Start: pick a dog -->
<div class="screen select" id="startScreen">
  <header class="brand">
    <h1>Freesbee</h1>
    <p data-i18n="brand.tag">Pick your dog. Your owner throws, you catch.</p>
  </header>
  <section class="panel" data-i18n-aria="menu.pick">
    <div class="panel-top">
      <div class="breed-count" id="breedCount">1 / 8</div>
      <label class="lang"><span class="sr" data-i18n="menu.lang">Language</span>
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2 10h16M10 2c2.5 2.6 2.5 13.4 0 16M10 2c-2.5 2.6-2.5 13.4 0 16" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <select id="langSelect"></select>
      </label>
    </div>
    <div class="breed-nav">
      <button class="nav-btn" id="prevBreed" type="button" data-i18n-aria="menu.prev">‹</button>
      <div class="breed-info">
        <h2 id="breedName">Border Collie</h2>
        <p id="breedTag"></p>
      </div>
      <button class="nav-btn" id="nextBreed" type="button" data-i18n-aria="menu.next">›</button>
    </div>
    <dl class="stats" id="breedStats"></dl>
    <div class="diff" role="radiogroup" data-i18n-aria="diff.label" id="diff">
      <button type="button" role="radio" data-diff="facile" aria-checked="false" data-i18n="diff.facile">Easy</button>
      <button type="button" role="radio" data-diff="normal" aria-checked="true" data-i18n="diff.normal">Normal</button>
      <button type="button" role="radio" data-diff="pro" aria-checked="false" data-i18n="diff.pro">Pro</button>
    </div>
    <p class="diff-note" id="diffNote"></p>
    <button class="play" id="playBtn" type="button"><span data-i18n="menu.play">Play</span><small id="playHint" hidden data-i18n="menu.playHint"></small></button>
    <details class="help">
      <summary data-i18n="menu.controls">Controls ▾</summary>
      <dl class="controls">
        <div class="ctrl-set ctrl-keys">
          <dt data-i18n="ctrl.run"></dt><dd data-i18n-html="keys.run"></dd>
          <dt data-i18n="ctrl.jump"></dt><dd data-i18n-html="keys.jump"></dd>
          <dt data-i18n="ctrl.sprint"></dt><dd data-i18n-html="keys.sprint"></dd>
          <dt data-i18n="ctrl.film"></dt><dd data-i18n-html="keys.film"></dd>
          <dt data-i18n="ctrl.pause"></dt><dd data-i18n-html="keys.pause"></dd>
          <dt data-i18n="ctrl.menu"></dt><dd data-i18n-html="keys.menu"></dd>
        </div>
        <div class="ctrl-set ctrl-touch">
          <dt data-i18n="ctrl.run"></dt><dd data-i18n="touch.run"></dd>
          <dt data-i18n="ctrl.jump"></dt><dd data-i18n="touch.jump"></dd>
          <dt data-i18n="ctrl.sprint"></dt><dd data-i18n="touch.sprint"></dd>
          <dt data-i18n="ctrl.film"></dt><dd data-i18n="touch.film"></dd>
        </div>
        <div class="ctrl-set ctrl-pad">
          <dt data-i18n="ctrl.run"></dt><dd data-i18n="pad.run"></dd>
          <dt data-i18n="ctrl.jump"></dt><dd data-i18n-html="pad.jump"></dd>
          <dt data-i18n="ctrl.sprint"></dt><dd data-i18n-html="pad.sprint"></dd>
          <dt data-i18n="ctrl.camera"></dt><dd data-i18n="pad.camera"></dd>
          <dt data-i18n="ctrl.film"></dt><dd data-i18n-html="pad.film"></dd>
          <dt data-i18n="ctrl.pause"></dt><dd data-i18n-html="pad.pause"></dd>
        </div>
      </dl>
    </details>
  </section>
</div>

<div class="screen" id="pauseScreen" hidden>
  <div class="card">
    <h2 data-i18n="pause.title">Paused</h2>
    <div class="btns">
      <button class="play" id="resumeBtn" type="button" data-i18n="pause.resume">Resume</button>
      <button class="btn alt" id="menuBtn" type="button" data-i18n="pause.menu">Change dog</button>
    </div>
  </div>
</div>

<div class="screen" id="overScreen" hidden>
  <div class="card">
    <h2 data-i18n="over.title">Game over</h2>
    <div class="final" id="finalScore">0</div>
    <p id="finalDetail"></p>
    <div class="btns">
      <button class="play" id="againBtn" type="button" data-i18n="over.again">Play again</button>
      <div class="btns two">
        <a class="btn dark" id="shareX" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-7.2 8.2L23 22h-6.6l-5.1-6.7L5.4 22H2.3l7.7-8.8L1 2h6.8l4.6 6.1L18.9 2Zm-1.2 18h1.8L6.4 3.9H4.5L17.7 20Z"/></svg>
          <span data-i18n="over.post">Post</span>
        </a>
        <button class="btn alt" id="copyLink" type="button" data-i18n="over.copy">Copy link</button>
      </div>
      <button class="btn alt" id="menuBtn2" type="button" data-i18n="over.menu">Change dog</button>
    </div>
  </div>
</div>

<div class="screen" id="videoScreen" hidden>
  <div class="card">
    <h2 data-i18n="video.title">Your clip is ready</h2>
    <video class="clip" id="clip" controls playsinline loop muted></video>
    <p class="note" id="clipInfo"></p>
    <div class="btns">
      <a class="play" id="clipDownload" href="#" download="freesbee.mp4" data-i18n="video.download">Download video</a>
      <div class="btns two">
        <button class="btn alt" id="clipShare" type="button" hidden data-i18n="video.share">Share…</button>
        <a class="btn dark" id="clipX" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-7.2 8.2L23 22h-6.6l-5.1-6.7L5.4 22H2.3l7.7-8.8L1 2h6.8l4.6 6.1L18.9 2Zm-1.2 18h1.8L6.4 3.9H4.5L17.7 20Z"/></svg>
          <span data-i18n="video.x">Post on X</span>
        </a>
      </div>
      <p class="note" data-i18n="video.note"></p>
      <button class="btn alt" id="clipClose" type="button" data-i18n="video.close">Close</button>
    </div>
  </div>
</div>
